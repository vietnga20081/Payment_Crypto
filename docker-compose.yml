version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: cgw_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: crypto_gateway
      MYSQL_USER: cgw_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cgwpassword}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cgw_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  gateway-api:
    build:
      context: ./gateway-api
      dockerfile: Dockerfile
    container_name: cgw_api
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://cgw_user:${MYSQL_PASSWORD:-cgwpassword}@mysql:3306/crypto_gateway
      REDIS_URL: redis://redis:6379
      PORT: 3000
      NODE_ENV: production
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      TRON_NODE_URL: ${TRON_NODE_URL:-https://api.trongrid.io}
      TRON_API_KEY: ${TRON_API_KEY}
      USDT_CONTRACT: ${USDT_CONTRACT:-TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t}
      FRONTEND_URL: http://localhost
      ALERT_TELEGRAM_BOT_TOKEN: ${ALERT_TELEGRAM_BOT_TOKEN}
      ALERT_TELEGRAM_CHAT_ID: ${ALERT_TELEGRAM_CHAT_ID}
      WATCHDOG_LISTENERS: tron-listener,bsc-listener
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - api_logs:/app/logs

  tron-listener:
    build:
      context: ./tron-listener
      dockerfile: Dockerfile
    container_name: cgw_listener
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://cgw_user:${MYSQL_PASSWORD:-cgwpassword}@mysql:3306/crypto_gateway
      REDIS_URL: redis://redis:6379
      TRON_NODE_URL: ${TRON_NODE_URL:-https://api.trongrid.io}
      TRON_API_KEY: ${TRON_API_KEY}
      USDT_CONTRACT: ${USDT_CONTRACT:-TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t}
      POLL_INTERVAL_MS: 3000
      CONFIRMATION_POLL_MS: 10000
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  bsc-listener:
    build:
      context: ./bsc-listener
      dockerfile: Dockerfile
    container_name: cgw_bsc_listener
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://cgw_user:${MYSQL_PASSWORD:-cgwpassword}@mysql:3306/crypto_gateway
      REDIS_URL: redis://redis:6379
      BSC_RPC_URL: ${BSC_RPC_URL:-https://bsc-dataseed.binance.org}
      USDT_BEP20_CONTRACT: ${USDT_BEP20_CONTRACT:-0x55d398326f99059fF775485246999027B3197955}
      POLL_INTERVAL_MS: 3000
      CONFIRMATION_POLL_MS: 10000
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  admin-web:
    build:
      context: ./admin-web
      dockerfile: Dockerfile
    container_name: cgw_web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - gateway-api

volumes:
  mysql_data:
  redis_data:
  api_logs:
