name: CI

# Chạy trên mọi push và pull request tới bất kỳ nhánh nào — mục tiêu là bắt
# được các lỗi kiểu "thiếu field bắt buộc sau khi đổi schema Prisma" hoặc
# "toAddress possibly null" TRƯỚC khi phải chạy deploy.sh thật trên server
# rồi mới biết bị lỗi (đã xảy ra nhiều lần trong quá trình phát triển).
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

env:
  # prisma generate cần DATABASE_URL tồn tại (dạng hợp lệ) nhưng KHÔNG cần
  # kết nối được — generate chỉ đọc schema, không query DB thật.
  DATABASE_URL: mysql://ci_user:ci_pass@127.0.0.1:3306/ci_placeholder

jobs:
  gateway-api:
    name: gateway-api (typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway-api
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install

      - name: Prisma generate
        run: pnpm exec prisma generate

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm run build

  tron-listener:
    name: tron-listener (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tron-listener
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install

      - name: Prisma generate
        run: pnpm exec prisma generate

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm run build

  bsc-listener:
    name: bsc-listener (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bsc-listener
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install

      - name: Prisma generate
        run: pnpm exec prisma generate

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm run build

  admin-web:
    name: admin-web (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck + build
        run: pnpm run build
