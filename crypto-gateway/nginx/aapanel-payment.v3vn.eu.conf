server
{
    listen 80;
    listen 443 ssl http2;
    server_name payment.v3vn.eu;
    index index.html index.htm;
    root /www/wwwroot/payment.v3vn.eu/public;

    include /www/server/panel/vhost/nginx/extension/payment.v3vn.eu/*.conf;

    #CERT-APPLY-CHECK--START
    include /www/server/panel/vhost/nginx/well-known/payment.v3vn.eu.conf;
    #CERT-APPLY-CHECK--END

    #SSL-START
    ssl_certificate    /www/server/panel/vhost/cert/payment.v3vn.eu/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/payment.v3vn.eu/privkey.pem;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    error_page 497 https://$host$request_uri;
    #SSL-END

    #ERROR-PAGE-START
    error_page 404 /404.html;
    error_page 502 /502.html;
    #ERROR-PAGE-END

    # ── Gzip ──────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;
    gzip_min_length 1024;

    # ── Proxy API → gateway-api (port 3007) ───────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:3007;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # ── WebSocket / Socket.IO ─────────────────────────────────
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3007;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout 86400s;
    }

    # ── Health check ──────────────────────────────────────────
    location /health {
        proxy_pass http://127.0.0.1:3007/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── Static assets cache ───────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
        error_log /dev/null;
        access_log /dev/null;
    }

    # ── React SPA — fallback về index.html ────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Bảo mật: chặn file nhạy cảm ─────────────────────────
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md)
    {
        return 404;
    }

    location ~ \.well-known {
        allow all;
    }

    if ($uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$") {
        return 403;
    }

    access_log  /www/wwwlogs/payment.v3vn.eu.log;
    error_log   /www/wwwlogs/payment.v3vn.eu.error.log;
}
